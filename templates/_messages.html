{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <ul class="messages">
            {% for category, message in messages %}
                <li class="{{ category }}" role="alert">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
{% endwith %}
{% if error %}
    <p class="error" role="alert">{{ error }}</p>
{% endif %}
