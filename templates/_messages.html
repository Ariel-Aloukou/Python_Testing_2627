{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="space-y-3 mb-6">
      {% for category, message in messages %}
        {% if category == 'success' %}
          <div class="success">
            <div role="alert" class="alert alert-success shadow-sm" style="background-color: #dcfce7; border: 1px solid #22c55e; color: #166534;">
              <i class="bi bi-check-circle"></i>
              <span>{{ message }}</span>
            </div>
          </div>
        {% elif category == 'error' %}
          <div class="error">
            <div role="alert" class="alert alert-error shadow-sm" style="background-color: #fee2e2; border: 1px solid #dc2626; color: #991b1b;">
              <i class="bi bi-exclamation-triangle"></i>
              <span>{{ message }}</span>
            </div>
          </div>
        {% else %}
          <div role="alert" class="alert shadow-sm">
            <i class="bi bi-info-circle"></i>
            <span>{{ message }}</span>
          </div>
        {% endif %}
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
